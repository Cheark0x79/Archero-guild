name: archero-guild-db-test

services:
  postgres-test:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: archero_test
      POSTGRES_USER: archero_test
      POSTGRES_PASSWORD: archero_test_password
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./observer/storage/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archero_test -d archero_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    cpus: "0.75"
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - test-backend

  db-contract-tests:
    build:
      context: .
      dockerfile: tests/integration/Dockerfile
    environment:
      ARCHERO_INTEGRATION_DATABASE_URL: postgresql://archero_test:archero_test_password@postgres-test:5432/archero_test
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /workspace
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    command: ["python", "-B", "-m", "unittest", "tests.integration.test_database_contract", "-v"]
    cpus: "0.75"
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - test-backend
    profiles: ["test"]

volumes:
  postgres-test-data:

networks:
  test-backend:
    internal: true
