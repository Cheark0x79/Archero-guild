openapi: 3.1.0
info:
  title: Archero Observer API
  version: 1.0.0
  description: API en lecture seule destinée notamment aux bots Discord.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - apiKey: []
paths:
  /health:
    get:
      summary: Vérifier la disponibilité
      security: []
      responses:
        "200":
          description: API disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
  /guild:
    get:
      summary: Obtenir le résumé de la guilde
      responses:
        "200":
          description: Résumé de guilde
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rules:
    get:
      summary: Obtenir les règles de guilde
      responses:
        "200": { description: Règles publiques }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /violations:
    get:
      summary: Lister les membres qui ne respectent pas les règles
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [warning, danger] } }
        - { name: flag, in: query, schema: { type: string } }
      responses:
        "200": { description: Résumé et membres concernés }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /rankings/members:
    get:
      summary: Classer les membres selon une métrique
      parameters:
        - { name: metric, in: query, schema: { type: string, enum: [power, contribution7d, powerDelta, contributionDelta, bossAttacks, activity], default: power } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200": { description: Classement demandé }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bosses:
    get:
      summary: Lister les boss et leurs records
      responses:
        "200": { description: Catalogue des boss }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /boss-results:
    get:
      summary: Lister les dégâts et rangs journaliers
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: boss, in: query, schema: { type: string } }
        - { name: playerId, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Résultats regroupés par journée }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /members:
    get:
      summary: Rechercher et lister les membres
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, former, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Liste paginée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /members/resolve:
    get:
      summary: Résoudre un membre par ID, nom, alias ou faute légère
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        "200": { description: Correspondance et suggestions }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /members/{playerId}:
    get:
      summary: Obtenir un membre par Player ID
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Membre trouvé
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
                  meta: { $ref: "#/components/schemas/Meta" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{playerId}/history:
    get:
      summary: Obtenir l’historique d’un membre
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Historique quotidien }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /members/{playerId}/bosses:
    get:
      summary: Obtenir les records boss d’un membre
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Records, participations et rangs par boss }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /rankings/boss/{ranking}:
    get:
      summary: Obtenir un classement boss
      parameters:
        - name: ranking
          in: path
          required: true
          schema: { type: string, enum: [all-time, weekly, by-boss] }
        - { name: boss, in: query, schema: { type: string } }
        - { name: week, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: Classement demandé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    apiKey: { type: apiKey, in: header, name: X-API-Key }
  responses:
    BadRequest:
      description: Paramètre invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Clé absente ou invalide
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Meta:
      type: object
      required: [apiVersion, generatedAt]
      properties:
        apiVersion: { type: string, const: v1 }
        generatedAt: { type: string, format: date-time }
        source: { type: string, enum: [database, local] }
        warning: { type: string }
        pagination:
          type: object
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
            hasMore: { type: boolean }
    Member:
      type: object
      required: [playerId, name, role, guildStatus, discordLinked, metrics, evaluation]
      properties:
        playerId: { type: [string, "null"] }
        name: { type: string }
        role: { type: string }
        guildStatus: { type: string }
        discordLinked: { type: boolean }
        joinedAt: { type: [string, "null"], format: date }
        leftAt: { type: [string, "null"], format: date }
        lastSeenAt: { type: [string, "null"] }
        metrics:
          type: object
          properties:
            power: { type: [integer, "null"] }
            powerDelta: { type: [integer, "null"] }
            contribution7d: { type: [integer, "null"] }
            contributionDelta: { type: [integer, "null"] }
            bossAttacks: { type: [integer, "null"] }
            lastActivityDays: { type: [integer, "null"] }
            captured: { type: boolean }
            verified: { type: boolean }
        evaluation:
          type: object
          properties:
            status: { type: string }
            severity: { type: string, enum: [positive, neutral, warning, danger] }
            flags: { type: array, items: { type: string } }
    MemberList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Member" } }
        meta: { $ref: "#/components/schemas/Meta" }
    Success:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
    Error:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
