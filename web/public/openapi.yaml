openapi: 3.1.0
info:
  title: Archero Observer API
  version: 1.0.0
  description: API JSON en lecture seule destinée notamment aux bots Discord.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - apiKey: []
paths:
  /health:
    get:
      summary: Vérifier la disponibilité
      security: []
      responses:
        "200": { description: API disponible }
  /guild:
    get:
      summary: Obtenir le résumé de la guilde
      responses:
        "200": { description: Résumé de guilde }
        "401": { description: Clé API absente ou invalide }
  /rules:
    get:
      summary: Obtenir les règles de guilde
      responses:
        "200": { description: Règles publiques }
  /violations:
    get:
      summary: Lister les membres qui ne respectent pas les règles
      parameters:
        - { name: severity, in: query, schema: { type: string, enum: [warning, danger] } }
        - { name: flag, in: query, schema: { type: string } }
      responses:
        "200": { description: Résumé et membres concernés }
  /rankings/members:
    get:
      summary: Classer les membres selon une métrique
      parameters:
        - { name: metric, in: query, schema: { type: string, enum: [power, contribution7d, powerDelta, contributionDelta, bossAttacks, activity] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Classement demandé }
  /bosses:
    get:
      summary: Lister les boss et leurs records
      responses:
        "200": { description: Catalogue des boss }
  /boss-results:
    get:
      summary: Lister les dégâts et rangs journaliers
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: boss, in: query, schema: { type: string } }
        - { name: playerId, in: query, schema: { type: string } }
      responses:
        "200": { description: Résultats regroupés par journée }
  /members:
    get:
      summary: Rechercher et lister les membres
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, former, all], default: active } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: Liste paginée }
        "400": { description: Paramètre invalide }
        "401": { description: Clé API absente ou invalide }
  /members/resolve:
    get:
      summary: Résoudre un membre par ID, nom, alias ou faute légère
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 5 } }
      responses:
        "200": { description: Correspondance et suggestions }
        "400": { description: Paramètre invalide }
  /members/{playerId}:
    get:
      summary: Obtenir un membre par Player ID
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Membre trouvé }
        "401": { description: Clé API absente ou invalide }
        "404": { description: Membre introuvable }
  /members/{playerId}/history:
    get:
      summary: Obtenir l’historique d’un membre
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Historique quotidien }
  /members/{playerId}/bosses:
    get:
      summary: Obtenir les records boss d’un membre
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Records, participations et rangs par boss }
        "404": { description: Membre introuvable }
  /rankings/boss/{ranking}:
    get:
      summary: Obtenir un classement boss
      parameters:
        - { name: ranking, in: path, required: true, schema: { type: string, enum: [all-time, weekly, by-boss] } }
        - { name: boss, in: query, schema: { type: string } }
        - { name: week, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200": { description: Classement demandé }
        "400": { description: Paramètre invalide }
        "401": { description: Clé API absente ou invalide }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
    apiKey: { type: apiKey, in: header, name: X-API-Key }
