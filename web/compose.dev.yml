name: archero-guild-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: archero_observer
      POSTGRES_USER: archero
      POSTGRES_PASSWORD: archero_dev_password
    ports:
      - "127.0.0.1:${ARCHERO_POSTGRES_PORT:-55440}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../ocr/app/archero_guild/storage/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archero -d archero_observer"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
