name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    # Dependency review requires GitHub Advanced Security for private repos;
    # it is available to this project once the repository is public.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
