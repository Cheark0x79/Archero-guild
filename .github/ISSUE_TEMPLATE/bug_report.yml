name: Bug report
description: Report a reproducible defect without private guild data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, screenshots, player identities, database exports, or security exploit details."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.2.1 or abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "Minimal, sanitized steps and observed result."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
