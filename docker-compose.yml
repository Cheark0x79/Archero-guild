services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: archero_observer
      POSTGRES_USER: archero
      POSTGRES_PASSWORD: archero_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./observer/storage/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres-data:

