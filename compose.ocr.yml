name: archero-ocr-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.ocr
    init: true
    working_dir: /app
    environment:
      ARCHERO_TARGET_URL: ${ARCHERO_TARGET_URL:?Set ARCHERO_TARGET_URL}
      ARCHERO_INGESTION_TOKEN: ${ARCHERO_INGESTION_TOKEN:?Set ARCHERO_INGESTION_TOKEN}
      ARCHERO_AGENT_VERSION: ${ARCHERO_AGENT_VERSION:-development}
      ARCHERO_SCREENSHOTS_ROOT: /captures
      TZ: Europe/Paris
    volumes:
      - ${ARCHERO_CAPTURE_ROOT:-./screenshots/raw}:/captures:ro
      - ${ARCHERO_OUTBOX_ROOT:-./data/outbox}:/outbox
    cpus: "2.00"
    mem_limit: 2g
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
